<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartMatch</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff5f7;
      color: #222;
    }

    header {
      background: #ff4f81;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #ff4f81, #ff8fab);
      color: white;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 28px;
      background: white;
      color: #ff4f81;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    .section h2 {
      margin-bottom: 25px;
      font-size: 30px;
    }

    .profiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    .profile {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .profile img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 14px;
    }

    .profile h3 {
      margin-top: 12px;
    }

    .profile p {
      color: #777;
      margin-top: 5px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #222;
      color: white;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">❤️ HeartMatch</div>
  <div>💕 Find Love</div>
</header>

<section class="hero">
  <h1>Find Someone Special</h1>
  <p>Meet new people, make meaningful connections and discover love.</p>
  <a href="#" class="btn">Create Your Profile</a>
</section>

<section class="section">
  <h2>People Looking for Love</h2>

  <div class="profiles">

    <div class="profile">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80">
      <h3>Sarah, 26</h3>
      <p>Accra, Ghana</p>
    </div>

    <div class="profile">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80">
      <h3>David, 29</h3>
      <p>Kumasi, Ghana</p>
    </div>

    <div class="profile">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80">
      <h3>Emma, 27</h3>
      <p>Tema, Ghana</p>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 HeartMatch. Connect. Meet. Love.</p>
</footer>

</body>
</html>
